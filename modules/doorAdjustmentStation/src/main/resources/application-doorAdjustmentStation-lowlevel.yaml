basys:
  opcuaServer:
    certsFolder: ./certs
    tcpPort: 12687
    httpsPort: 8443
  controlcomponent:
    id: door_adjustment_station_1_ll
    name: DoorAdjustmentStation
    operationModeJavaPackage: de.dfki.cos.basys.p4p.controlcomponent.doorAdjustmentStation.lowlevel.opmodes
    initialExecutionMode: AUTO
    executionModes:
      auto:
        executionModeChangeDisabled: true
        occupationCheckDisabled: true
        service:
          implementationJavaClass: de.dfki.cos.basys.p4p.controlcomponent.doorAdjustmentStation.lowlevel.service.DoorAdjustmentStationServiceImpl
          connectionString: tcp://10.2.10.4:1883
          properties:
      simulate:
        executionModeChangeDisabled: true
        occupationCheckDisabled: true
spring:
  cloud:
    function:
      definition: doorEventUpdates
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKER_ENDPOINT}
      bindings:
        doorEventUpdates-in-0:
          destination: vw.tiguan.doors.jointstatestamped
          content-type: application/*+avro
          binder: kafka-avro
      binders:
        kafka-json:
          type: kafka
        kafka-avro:
          type: kafka
          environment:
            spring:
              cloud:
                stream:
                  kafka:
                    binder:
                      producer-properties:
                        key.serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
                        #key.deserializer: org.apache.kafka.common.serialization.StringSerializer
                        value.serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
                        schema.registry.url: ${SCHEMA_REGISTRY_ENDPOINT}
                      consumer-properties:
                        key.deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
                        #key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
                        value.deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
                        schema.registry.url: ${SCHEMA_REGISTRY_ENDPOINT}
                        specific.avro.reader: true
